  - id: m015
    question: "¿Qué marca de televisores vendió más unidades en 2025?"
    tags: [unidades_vendidas, productos, marcas, ranking]
    order_matters: true
    gold_sql: |
      SELECT p.marca, SUM(dv.cantidad) AS unidades
      FROM retail.detalle_ventas dv
      JOIN retail.ventas v ON v.venta_id = dv.venta_id
      JOIN retail.productos p ON p.producto_id = dv.producto_id
      WHERE p.nombre LIKE 'Smart TV%' AND v.estado = 'completada'
        AND NOT EXISTS (SELECT 1 FROM retail.devoluciones d WHERE d.detalle_id = dv.detalle_id)
        AND v.fecha_venta >= DATE '2025-01-01' AND v.fecha_venta < DATE '2026-01-01'
      GROUP BY p.marca
      ORDER BY unidades DESC LIMIT 1

  - id: m016
    question: "¿Qué porcentaje del número de ventas completadas de 2025 se pagó con billetera móvil?"
    tags: [ventas, metodo_pago, porcentaje]
    gold_sql: |
      SELECT 100.0 * COUNT(*) FILTER (WHERE metodo_pago = 'billetera_movil') / COUNT(*) AS porcentaje
      FROM retail.ventas
      WHERE estado = 'completada' AND fecha_venta >= DATE '2025-01-01' AND fecha_venta < DATE '2026-01-01'

  - id: m017
    question: "¿Cuál fue el monto reembolsado por devoluciones en cada sucursal en 2025?"
    tags: [devoluciones, sucursales, suma]
    gold_sql: |
      SELECT s.nombre, SUM(d.monto_reembolsado) AS monto_reembolsado
