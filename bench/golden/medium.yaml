  - id: m031
    question: "¿Cuántos empleados reportan directamente al gerente de la sucursal Cuenca Centro?"
    tags: [empleados, jerarquia]
    gold_sql: |
      SELECT COUNT(*) AS empleados
      FROM retail.empleados e
      JOIN retail.empleados g ON g.empleado_id = e.supervisor_id
      JOIN retail.sucursales s ON s.sucursal_id = g.sucursal_id
      WHERE g.cargo = 'gerente de sucursal' AND s.nombre = 'Cuenca Centro'

  - id: m032
