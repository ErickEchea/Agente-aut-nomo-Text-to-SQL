      JOIN retail.ventas v ON v.venta_id = d.venta_id
      JOIN retail.sucursales s ON s.sucursal_id = v.sucursal_id
      WHERE d.fecha_devolucion >= DATE '2025-01-01' AND d.fecha_devolucion < DATE '2026-01-01'
      GROUP BY s.nombre

