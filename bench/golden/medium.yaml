  - id: m029
    question: "¿Cuántos clientes registrados distintos compraron en la sucursal Samborondón en 2025?"
    tags: [clientes, sucursales, conteo_distinto]
    gold_sql: |
      SELECT COUNT(DISTINCT v.cliente_id) AS clientes
      FROM retail.ventas v JOIN retail.sucursales s ON s.sucursal_id = v.sucursal_id
      WHERE s.nombre = 'Samborondón' AND v.estado = 'completada' AND v.cliente_id IS NOT NULL
        AND v.fecha_venta >= DATE '2025-01-01' AND v.fecha_venta < DATE '2026-01-01'

  - id: m030
    question: "Ingresos mensuales de la categoría Juguetes en 2025"
    tags: [ingresos, categorias, serie_mensual, estacionalidad]
    gold_sql: |
      SELECT date_trunc('month', v.fecha_venta) AS mes, SUM(dv.cantidad * dv.precio_unitario - dv.descuento) AS ingresos
