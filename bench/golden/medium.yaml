  - id: m019
    question: "¿Cuántos clientes se registraron cada mes de 2025?"
    tags: [clientes, serie_mensual]
    gold_sql: |
      SELECT date_trunc('month', fecha_registro) AS mes, COUNT(*) AS clientes
      FROM retail.clientes
      WHERE fecha_registro >= DATE '2025-01-01' AND fecha_registro < DATE '2026-01-01'
      GROUP BY 1

  - id: m020
    question: "¿Cuántas ventas completadas hubo en cada hora del día durante 2025?"
    tags: [ventas, hora]
    gold_sql: |
      SELECT EXTRACT(HOUR FROM fecha_venta) AS hora, COUNT(*) AS ventas
      FROM retail.ventas
      WHERE estado = 'completada' AND fecha_venta >= DATE '2025-01-01' AND fecha_venta < DATE '2026-01-01'
      GROUP BY 1

