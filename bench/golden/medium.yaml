# Golden set: medium questions (joins plus aggregation, glossary metrics, time grain).
# "ingresos" and "unidades vendidas" follow data/glossary.yaml: completed sales only, returned lines excluded.
difficulty: medium
items:
  - id: m001
    question: "¿Cuáles fueron los cinco productos más vendidos durante el último trimestre?"
    tags: [unidades_vendidas, productos, ranking, tiempo_relativo]
    order_matters: true
    gold_sql: |
      SELECT p.nombre, SUM(dv.cantidad) AS unidades
      FROM retail.detalle_ventas dv
      JOIN retail.ventas v ON v.venta_id = dv.venta_id
      JOIN retail.productos p ON p.producto_id = dv.producto_id
      WHERE v.estado = 'completada'
        AND NOT EXISTS (SELECT 1 FROM retail.devoluciones d WHERE d.detalle_id = dv.detalle_id)
        AND v.fecha_venta >= DATE '2026-07-01' AND v.fecha_venta < DATE '2026-10-01'
      GROUP BY p.producto_id, p.nombre
      ORDER BY unidades DESC LIMIT 5

  - id: m002
    question: "¿Qué sucursal generó mayores ingresos durante el último trimestre?"
    tags: [ingresos, sucursales, ranking, tiempo_relativo]
    order_matters: true
    gold_sql: |
      SELECT s.nombre, SUM(dv.cantidad * dv.precio_unitario - dv.descuento) AS ingresos
      FROM retail.detalle_ventas dv
      JOIN retail.ventas v ON v.venta_id = dv.venta_id
      JOIN retail.sucursales s ON s.sucursal_id = v.sucursal_id
      WHERE v.estado = 'completada'
        AND NOT EXISTS (SELECT 1 FROM retail.devoluciones d WHERE d.detalle_id = dv.detalle_id)
        AND v.fecha_venta >= DATE '2026-07-01' AND v.fecha_venta < DATE '2026-10-01'
      GROUP BY s.sucursal_id, s.nombre
      ORDER BY ingresos DESC LIMIT 1

  - id: m003
    question: "Ingresos por región en 2025"
    tags: [ingresos, regiones, agrupacion]
    gold_sql: |
      SELECT r.nombre, SUM(dv.cantidad * dv.precio_unitario - dv.descuento) AS ingresos
      FROM retail.detalle_ventas dv
      JOIN retail.ventas v ON v.venta_id = dv.venta_id
      JOIN retail.sucursales s ON s.sucursal_id = v.sucursal_id
      JOIN retail.regiones r ON r.region_id = s.region_id
      WHERE v.estado = 'completada'
        AND NOT EXISTS (SELECT 1 FROM retail.devoluciones d WHERE d.detalle_id = dv.detalle_id)
        AND v.fecha_venta >= DATE '2025-01-01' AND v.fecha_venta < DATE '2026-01-01'
      GROUP BY r.nombre

  - id: m004
    question: "¿Cuál es el ticket promedio por método de pago este año?"
    tags: [ticket_promedio, metodo_pago, tiempo_relativo]
    gold_sql: |
      SELECT v.metodo_pago,
             SUM(dv.cantidad * dv.precio_unitario - dv.descuento) / COUNT(DISTINCT v.venta_id) AS ticket_promedio
      FROM retail.detalle_ventas dv
      JOIN retail.ventas v ON v.venta_id = dv.venta_id
      WHERE v.estado = 'completada'
        AND NOT EXISTS (SELECT 1 FROM retail.devoluciones d WHERE d.detalle_id = dv.detalle_id)
        AND v.fecha_venta >= DATE '2026-01-01' AND v.fecha_venta < DATE '2026-11-01'
      GROUP BY v.metodo_pago

  - id: m005
    question: "¿Qué categoría tuvo más devoluciones registradas en 2025?"
    tags: [devoluciones, categorias, ranking]
    order_matters: true
    gold_sql: |
      SELECT c.nombre, COUNT(*) AS devoluciones
      FROM retail.devoluciones d
      JOIN retail.detalle_ventas dv ON dv.detalle_id = d.detalle_id
      JOIN retail.productos p ON p.producto_id = dv.producto_id
      JOIN retail.categorias c ON c.categoria_id = p.categoria_id
      WHERE d.fecha_devolucion >= DATE '2025-01-01' AND d.fecha_devolucion < DATE '2026-01-01'
      GROUP BY c.nombre
      ORDER BY devoluciones DESC LIMIT 1

  - id: m006
    question: "Ordena los motivos de devolución de este año del más frecuente al menos frecuente."
    tags: [devoluciones, ranking, tiempo_relativo]
    order_matters: true
    gold_sql: |
      SELECT motivo, COUNT(*) AS devoluciones FROM retail.devoluciones
      WHERE fecha_devolucion >= DATE '2026-01-01' AND fecha_devolucion < DATE '2026-11-01'
      GROUP BY motivo ORDER BY devoluciones DESC

  - id: m007
    question: "¿Qué productos estaban por debajo del stock mínimo en la sucursal Cuenca Centro al cierre de septiembre de 2026?"
    tags: [inventario, bajo_stock_minimo, sucursales]
    gold_sql: |
      SELECT p.nombre
      FROM retail.inventario i
      JOIN retail.productos p ON p.producto_id = i.producto_id
      JOIN retail.sucursales s ON s.sucursal_id = i.sucursal_id
      WHERE s.nombre = 'Cuenca Centro' AND i.fecha_corte = DATE '2026-09-30' AND i.stock < i.stock_minimo

  - id: m008
    question: "¿Cuántos productos tenían quiebre de stock en cada sucursal al cierre de agosto de 2026?"
    tags: [inventario, quiebre_de_stock, sucursales]
    gold_sql: |
      SELECT s.nombre, COUNT(*) AS productos_sin_stock
      FROM retail.inventario i JOIN retail.sucursales s ON s.sucursal_id = i.sucursal_id
      WHERE i.fecha_corte = DATE '2026-08-31' AND i.stock = 0
      GROUP BY s.nombre

  - id: m009
    question: "¿Qué cajero registró más ventas completadas en la sucursal Quito Iñaquito en 2025? Indica su id de empleado."
    tags: [empleados, ventas, ranking]
    order_matters: true
    gold_sql: |
      SELECT e.empleado_id, COUNT(*) AS ventas
      FROM retail.ventas v
      JOIN retail.empleados e ON e.empleado_id = v.empleado_id
      JOIN retail.sucursales s ON s.sucursal_id = v.sucursal_id
      WHERE s.nombre = 'Quito Iñaquito' AND e.cargo = 'cajero' AND v.estado = 'completada'
        AND v.fecha_venta >= DATE '2025-01-01' AND v.fecha_venta < DATE '2026-01-01'
      GROUP BY e.empleado_id
      ORDER BY ventas DESC LIMIT 1

  - id: m010
    question: "Número de ventas completadas por mes y por canal (online y tienda) en 2026"
    tags: [ventas, canal, serie_mensual]
    gold_sql: |
      SELECT date_trunc('month', fecha_venta) AS mes, canal, COUNT(*) AS ventas
      FROM retail.ventas
      WHERE estado = 'completada' AND fecha_venta >= DATE '2026-01-01' AND fecha_venta < DATE '2027-01-01'
      GROUP BY 1, 2

  - id: m011
    question: "¿Cuál fue el margen bruto de cada categoría en 2025?"
    tags: [margen_bruto, categorias]
    gold_sql: |
      SELECT c.nombre,
             SUM(dv.cantidad * dv.precio_unitario - dv.descuento) - SUM(dv.cantidad * p.costo_unitario) AS margen_bruto
      FROM retail.detalle_ventas dv
      JOIN retail.ventas v ON v.venta_id = dv.venta_id
      JOIN retail.productos p ON p.producto_id = dv.producto_id
      JOIN retail.categorias c ON c.categoria_id = p.categoria_id
      WHERE v.estado = 'completada'
        AND NOT EXISTS (SELECT 1 FROM retail.devoluciones d WHERE d.detalle_id = dv.detalle_id)
        AND v.fecha_venta >= DATE '2025-01-01' AND v.fecha_venta < DATE '2026-01-01'
      GROUP BY c.nombre

  - id: m012
    question: "¿Cuáles son los 10 clientes con más ingresos este año? Muestra su id de cliente."
    tags: [ingresos, clientes, ranking, tiempo_relativo]
    order_matters: true
    gold_sql: |
      SELECT v.cliente_id, SUM(dv.cantidad * dv.precio_unitario - dv.descuento) AS ingresos
      FROM retail.detalle_ventas dv
      JOIN retail.ventas v ON v.venta_id = dv.venta_id
      WHERE v.estado = 'completada' AND v.cliente_id IS NOT NULL
        AND NOT EXISTS (SELECT 1 FROM retail.devoluciones d WHERE d.detalle_id = dv.detalle_id)
        AND v.fecha_venta >= DATE '2026-01-01' AND v.fecha_venta < DATE '2026-11-01'
      GROUP BY v.cliente_id
      ORDER BY ingresos DESC LIMIT 10

  - id: m013
    question: "¿Cuántas unidades de Útiles Escolares se vendieron en cada región en abril de 2026?"
    tags: [unidades_vendidas, categorias, regiones, estacionalidad]
    gold_sql: |
      SELECT r.nombre, SUM(dv.cantidad) AS unidades
      FROM retail.detalle_ventas dv
      JOIN retail.ventas v ON v.venta_id = dv.venta_id
      JOIN retail.productos p ON p.producto_id = dv.producto_id
      JOIN retail.categorias c ON c.categoria_id = p.categoria_id
      JOIN retail.sucursales s ON s.sucursal_id = v.sucursal_id
      JOIN retail.regiones r ON r.region_id = s.region_id
      WHERE c.nombre = 'Útiles Escolares' AND v.estado = 'completada'
        AND NOT EXISTS (SELECT 1 FROM retail.devoluciones d WHERE d.detalle_id = dv.detalle_id)
        AND v.fecha_venta >= DATE '2026-04-01' AND v.fecha_venta < DATE '2026-05-01'
      GROUP BY r.nombre

