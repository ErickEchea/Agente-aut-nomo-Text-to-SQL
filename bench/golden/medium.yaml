        AND v.fecha_venta >= DATE '2025-01-01' AND v.fecha_venta < DATE '2026-01-01'
      GROUP BY p.producto_id, p.nombre
      ORDER BY ingresos DESC LIMIT 1

  - id: m037
    question: "¿Cuántos clientes de cada segmento compraron al menos una vez el último trimestre?"
    tags: [clientes, conteo_distinto, tiempo_relativo]
    gold_sql: |
      SELECT c.segmento, COUNT(DISTINCT c.cliente_id) AS clientes
      FROM retail.ventas v JOIN retail.clientes c ON c.cliente_id = v.cliente_id
      WHERE v.estado = 'completada' AND v.fecha_venta >= DATE '2026-07-01' AND v.fecha_venta < DATE '2026-10-01'
      GROUP BY c.segmento

  - id: m038
    question: "¿Cuál es el stock total de cada categoría al cierre de octubre de 2026?"
    tags: [inventario, categorias, suma]
    gold_sql: |
      SELECT c.nombre, SUM(i.stock) AS stock
      FROM retail.inventario i
      JOIN retail.productos p ON p.producto_id = i.producto_id
      JOIN retail.categorias c ON c.categoria_id = p.categoria_id
      WHERE i.fecha_corte = DATE '2026-10-31'
      GROUP BY c.nombre

  - id: m039
    question: "Ingresos por año"
    tags: [ingresos, serie_anual]
    gold_sql: |
      SELECT date_trunc('year', v.fecha_venta) AS anio, SUM(dv.cantidad * dv.precio_unitario - dv.descuento) AS ingresos
      FROM retail.detalle_ventas dv
      JOIN retail.ventas v ON v.venta_id = dv.venta_id
      WHERE v.estado = 'completada'
        AND NOT EXISTS (SELECT 1 FROM retail.devoluciones d WHERE d.detalle_id = dv.detalle_id)
      GROUP BY 1

  - id: m040
    question: "¿Cuál fue el descuento promedio por venta completada en cada canal en 2025?"
    tags: [ventas, descuento, canal, promedio]
    gold_sql: |
      SELECT canal, AVG(descuento_total) AS descuento_promedio FROM retail.ventas
      WHERE estado = 'completada' AND fecha_venta >= DATE '2025-01-01' AND fecha_venta < DATE '2026-01-01'
      GROUP BY canal
