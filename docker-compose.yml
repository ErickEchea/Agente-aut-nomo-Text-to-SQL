# NEXUS AI — full local stack. Start with `make up` (selects the GPU/CPU profile and waits for health).
# Plain `docker compose up -d --wait` works too and uses the CPU model unless NEXUS_LLM_MODEL is set.
name: nexus

x-backend-image: &backend-build
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: nexus-backend:local

# Least privilege (ADR-0023): no privilege escalation and no Linux capabilities by default.
x-locked-down: &locked-down
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

# Stateless services: read-only root filesystem, scratch space in memory.
x-read-only: &read-only
  read_only: true
  tmpfs: [/tmp]

# The official PostgreSQL entrypoint fixes data-directory ownership as root, then drops to `postgres`.
x-postgres-caps: &postgres-caps
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

x-models: &models
  NEXUS_LLM_MODEL: ${NEXUS_LLM_MODEL:-qwen2.5-coder:3b}
  NEXUS_EMBEDDING_MODEL: ${NEXUS_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  NEXUS_LLM_EXTRA_MODELS: ${NEXUS_LLM_EXTRA_MODELS:-}

services:
  app-db:
    <<: *postgres-caps
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${NEXUS_APP_DB_SUPERUSER_PASSWORD:?run `make env` first}
      NEXUS_APP_DB_PASSWORD: ${NEXUS_APP_DB_PASSWORD:?run `make env` first}
    volumes:
      - app-db-data:/var/lib/postgresql
      - ./infra/postgres/app:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${NEXUS_APP_DB_PORT:-55432}:5432"
    healthcheck:
      # -h forces TCP: during init the server listens on the socket only, so this stays red until init ends.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d nexus_app"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  demo-db:
    <<: *postgres-caps
    build:
      context: ./infra/postgres/demo-image
    image: nexus-demo-db:local
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_wal_size=2GB"]
    environment:
      POSTGRES_PASSWORD: ${NEXUS_DEMO_DB_SUPERUSER_PASSWORD:?run `make env` first}
      NEXUS_DEMO_OWNER_PASSWORD: ${NEXUS_DEMO_OWNER_PASSWORD:?run `make env` first}
      NEXUS_DEMO_READER_PASSWORD: ${NEXUS_DEMO_READER_PASSWORD:?run `make env` first}
    volumes:
      - demo-db-data:/var/lib/postgresql
      - ./infra/postgres/demo:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${NEXUS_DEMO_DB_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d retail"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  # Applies demo-db extensions (HypoPG) idempotently, also on volumes created before Phase 5.
  demo-extensions:
    <<: [*locked-down, *read-only]
    image: nexus-demo-db:local
    restart: "no"
    command:
      ["psql", "-v", "ON_ERROR_STOP=1", "-h", "demo-db", "-U", "postgres", "-d", "retail",
       "-f", "/sql/demo-extensions.sql"]
    environment:
      PGPASSWORD: ${NEXUS_DEMO_DB_SUPERUSER_PASSWORD:?run `make env` first}
    volumes:
      - ./infra/postgres/demo/sql:/sql:ro
    depends_on:
      demo-db:
        condition: service_healthy

  demo-seed:
    <<: [*backend-build, *locked-down, *read-only]
    command: ["nexus-seed-demo"]
    restart: "no"
    environment:
      NEXUS_SEED_DB__HOST: demo-db
      NEXUS_SEED_DB__NAME: retail
      NEXUS_SEED_DB__USER: retail_owner
      NEXUS_SEED_DB__PASSWORD: ${NEXUS_DEMO_OWNER_PASSWORD:?run `make env` first}
      NEXUS_DEMO_SEED: ${NEXUS_DEMO_SEED:-20241101}
      NEXUS_DEMO_SCALE: ${NEXUS_DEMO_SCALE:-1.0}
    depends_on:
      demo-db:
        condition: service_healthy

  migrate:
    <<: [*backend-build, *locked-down, *read-only]
    command: ["nexus-migrate"]
    restart: "no"
    environment:
      NEXUS_APP_DB__HOST: app-db
      NEXUS_APP_DB__NAME: nexus_app
      NEXUS_APP_DB__USER: nexus_app
      NEXUS_APP_DB__PASSWORD: ${NEXUS_APP_DB_PASSWORD:?run `make env` first}
    depends_on:
      app-db:
        condition: service_healthy

  ollama:
    <<: *locked-down
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    # Published on loopback only, on 11435: the host may already run its own Ollama on 11434.
    ports:
      - "127.0.0.1:${NEXUS_OLLAMA_PORT:-11435}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-init:
    <<: *locked-down
    image: ollama/ollama:0.40.16
    restart: "no"
    environment:
      <<: *models
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    # Extra models (comma-separated) serve the per-node routing (ADR-0003 §3, ADR-0022).
    command:
      - >-
        ollama pull "$$NEXUS_LLM_MODEL" && ollama pull "$$NEXUS_EMBEDDING_MODEL" &&
        for m in $$(echo "$$NEXUS_LLM_EXTRA_MODELS" | tr ',' ' '); do ollama pull "$$m" || exit 1; done
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    <<: [*backend-build, *locked-down, *read-only]
    restart: unless-stopped
    environment:
      NEXUS_ENV: ${NEXUS_ENV:-production}
      NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-INFO}
      NEXUS_CORS_ORIGINS: ${NEXUS_CORS_ORIGINS:-http://localhost:8080}
      NEXUS_APP_DB__HOST: app-db
      NEXUS_APP_DB__NAME: nexus_app
      NEXUS_APP_DB__USER: nexus_app
      NEXUS_APP_DB__PASSWORD: ${NEXUS_APP_DB_PASSWORD:?run `make env` first}
      NEXUS_DEMO_DB__HOST: demo-db
      NEXUS_DEMO_DB__NAME: retail
      NEXUS_DEMO_DB__USER: nexus_reader
      NEXUS_DEMO_DB__PASSWORD: ${NEXUS_DEMO_READER_PASSWORD:?run `make env` first}
      NEXUS_OLLAMA__BASE_URL: http://ollama:11434
      NEXUS_OLLAMA__LLM_MODEL: ${NEXUS_LLM_MODEL:-qwen2.5-coder:3b}
      NEXUS_OLLAMA__EMBEDDING_MODEL: ${NEXUS_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      NEXUS_OLLAMA__THINK: ${NEXUS_LLM_THINK:-}
      NEXUS_OLLAMA__EXTRA_MODELS: ${NEXUS_LLM_EXTRA_MODELS:-}
      NEXUS_AGENT__MODELS__UNDERSTAND: ${NEXUS_LLM_MODEL_UNDERSTAND:-}
      NEXUS_AGENT__MODELS__PLAN: ${NEXUS_LLM_MODEL_PLAN:-}
      NEXUS_AGENT__MODELS__GENERATE: ${NEXUS_LLM_MODEL_GENERATE:-}
      NEXUS_AGENT__MODELS__REPAIR: ${NEXUS_LLM_MODEL_REPAIR:-}
      NEXUS_AGENT__MODELS__VISUALIZE: ${NEXUS_LLM_MODEL_VISUALIZE:-}
      NEXUS_AGENT__MODELS__EXPLAIN: ${NEXUS_LLM_MODEL_EXPLAIN:-}
      NEXUS_SECURITY__JWT_SECRET: ${NEXUS_JWT_SECRET:?run `make env` first}
      NEXUS_SECURITY__BOOTSTRAP_ADMIN_EMAIL: ${NEXUS_ADMIN_EMAIL:-admin@nexus.local}
      NEXUS_SECURITY__BOOTSTRAP_ADMIN_PASSWORD: ${NEXUS_ADMIN_PASSWORD:?run `make env` first}
      NEXUS_SECURITY__COOKIE_SECURE: ${NEXUS_COOKIE_SECURE:-false}
      NEXUS_AGENT__AS_OF: ${NEXUS_AGENT_AS_OF:-}
      NEXUS_AGENT__PII_COLUMNS: ${NEXUS_PII_COLUMNS:-}
      NEXUS_CONNECTIONS__CREDENTIALS_KEYS: ${NEXUS_CREDENTIALS_KEYS:?run `make env` first}
      NEXUS_CONNECTIONS__SQLITE_DIR: /data/sqlite
    volumes:
      # SQLite files admins may register as data sources; mounted read-only (ADR-0013).
      - ./data/sqlite:/data/sqlite:ro
    # No published port: nginx (frontend, :8080) is the only way in, so the X-Forwarded-For it sets
    # is the only one uvicorn ever sees (ADR-0023). Development tools use http://localhost:8080/api.
    depends_on:
      app-db:
        condition: service_healthy
      demo-db:
        condition: service_healthy
      demo-seed:
        condition: service_completed_successfully
      demo-extensions:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    <<: [*locked-down, *read-only]
    build:
      context: ./frontend
    image: nexus-frontend:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXUS_WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # Load sanity check (`make load`, ADR-0023): k6 inside the stack's network, through nginx like a browser.
  # Only started on demand (profile `tools`); writes docs/load-test.md.
  k6:
    <<: [*locked-down, *read-only]
    image: grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276
    profiles: [tools]
    environment:
      NEXUS_WEB_URL: http://frontend:8080
      NEXUS_LOAD_PASSWORD: ${NEXUS_LOAD_PASSWORD:-}
    volumes:
      - ./infra/load:/scripts:ro
      - ./docs:/out

volumes:
  app-db-data:
  demo-db-data:
  ollama-models:
