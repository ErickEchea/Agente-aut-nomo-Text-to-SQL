name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Actions are pinned by commit SHA (a tag can be repointed; GHSA-69fq-xp46-6x23); Dependabot bumps them.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Unit, security and integration tests (Testcontainers) with coverage
        run: uv run pytest --cov --cov-report=term
      - name: Coverage gate (>= 85 % on agent, security, sql)
        run: uv run coverage report --fail-under=85 --include="src/nexus/agent/*,src/nexus/security/*,src/nexus/sql/*"

  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: API types match the committed OpenAPI snapshot
        run: npm run api:check
      - run: npm run test
      - run: npm run build

  audit:
    name: Security audit — dependencies and git history
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans every commit, not just the last one
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Known vulnerabilities in locked dependencies (pip-audit, npm audit)
        run: make audit-deps
      - name: Secrets in the git history (gitleaks)
        run: make audit-secrets

  images:
    name: Docker images and compose config
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate compose files
        run: |
          cp .env.example .env
          sed -i 's/=__GENERATE__$/=ci-placeholder-secret/' .env
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t nexus-backend:ci .
      - name: Build frontend image
        run: docker build -t nexus-frontend:ci frontend
      - name: Build demo database image
        run: docker build -t nexus-demo-db:ci infra/postgres/demo-image
      - name: Image vulnerabilities (Trivy; fixable HIGH/CRITICAL fail)
        run: make audit-images IMAGE_TAG=ci
      - name: Seed job runs in the image (dry run)
        run: docker run --rm nexus-backend:ci nexus-seed-demo --dry-run --scale 0.02
