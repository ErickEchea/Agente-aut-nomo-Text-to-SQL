name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag; pin the exact release.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Unit, security and integration tests (Testcontainers) with coverage
        run: uv run pytest --cov --cov-report=term
      - name: Coverage gate (>= 85 % on agent, security, sql)
        run: uv run coverage report --fail-under=85 --include="src/nexus/agent/*,src/nexus/security/*,src/nexus/sql/*"

  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  images:
    name: Docker images and compose config
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          sed -i 's/=__GENERATE__$/=ci-placeholder-secret/' .env
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t nexus-backend:ci .
      - name: Build frontend image
        run: docker build -t nexus-frontend:ci frontend
      - name: Seed job runs in the image (dry run)
        run: docker run --rm nexus-backend:ci nexus-seed-demo --dry-run --scale 0.02
