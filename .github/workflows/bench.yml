name: Benchmark (CI subset)

# The golden-set CI subset on the CPU model (ADR-0015, ADR-0022): the full stack comes up exactly as
# `make up` builds it (CPU profile, demo data at scale 1.0, models pulled by ollama-init), then
# `make bench-ci` runs the subset through the real agent and gates on the calibrated accuracy.
# Separate from CI because CPU inference takes a while; it runs when the agent or the benchmark change.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "backend/src/nexus/agent/**"
      - "backend/src/nexus/rag/**"
      - "backend/src/nexus/sql/**"
      - "backend/src/nexus/llm/**"
      - "backend/src/nexus/bench/**"
      - "bench/**"
      - "data/**"
      - "docker-compose*.yml"
      - ".github/workflows/bench.yml"

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-subset:
    name: Golden-set subset on the CPU model
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NEXUS_PROFILE: cpu
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Start the stack (CPU profile, waits for every healthcheck)
        run: make up
      - name: Let the container user write run records into the mounted bench/ and docs/
        run: chmod -R a+rwX bench docs
      - name: Run the CI subset and check the accuracy gate
        run: make bench-ci
      - name: Keep the run record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-ci-results
          path: bench/results/*-ci-*.json
          if-no-files-found: ignore
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 backend ollama
