# Weekly version updates (security updates are not delayed). A 7-day cooldown keeps a freshly published
# release (the window in which compromised releases are usually caught) out of the proposals.
# Runtime and toolchain jumps are deliberate decisions (ADR-0002), so they are ignored here:
# Python stays on 3.13, Node on 24, PostgreSQL on 18, TypeScript on 6.0 (typescript-eslint), and nginx on
# its stable branch. Ollama only gets patch releases: the benchmark measured that version (ADR-0022).
# Model weights are not dependencies here: the default model is a benchmark decision.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      javascript:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directories: ["/backend", "/frontend", "/infra/postgres/demo-image"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nginx"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "ollama/ollama"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "pgvector/pgvector"
        update-types: ["version-update:semver-major"]
