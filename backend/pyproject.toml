[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS AI — autonomous Text-to-SQL business intelligence agent"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "structlog==26.1.0",
    "sqlalchemy[asyncio]==2.1.9",
    "asyncpg==0.32.0",
    "psycopg[binary]==3.3.9",
    "httpx==0.28.1",
    "numpy==2.5.5",
    "pyyaml==6.0.3",
    "langgraph==1.2.24",
    "langchain-core==1.8.4",
    "ollama==0.6.3",
    "sqlglot==30.33.0",
    "alembic==1.20.1",
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "sse-starlette==3.7.0",
    "pgvector==0.5.1",
    "aiomysql==0.3.2",
    "aiosqlite==0.22.1",
    "cryptography==50.0.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.17",
    "testcontainers[postgres]==4.15.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "types-pyyaml==6.0.12.20261113",
    "pre-commit==4.7.0",
    "httpx2==2.16.2",
]

[project.scripts]
nexus-seed-demo = "nexus.demo.cli:main"
nexus-migrate = "nexus.db.migrate:main"
nexus-admin = "nexus.admin_cli:main"
nexus-eval-retrieval = "nexus.rag.evaluate:main"
nexus-export-sqlite = "nexus.demo.sqlite_export:main"
nexus-bench = "nexus.bench.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "ASYNC", "PT", "RET",
    "PTH", "TRY", "PERF", "LOG", "G", "DTZ", "T20", "ERA", "PL",
]
ignore = [
    "PLR0913",  # explicit keyword-heavy constructors are clearer than config bags here
    "TRY003",   # contextual exception messages are intentional
    "PLR2004",  # numeric literals in data-generation code are domain constants with comments
]

[tool.ruff.lint.pylint]
max-returns = 8

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, fixture passwords, naive datetimes that mirror `timestamp without time zone` columns.
"tests/**" = [
    "S101", "S105", "S106", "S107", "S311", "PLR2004", "S608", "DTZ001", "SLF001",
    "E501",    # long literal SQL/questions read better unwrapped
    "RUF001",  # expected Spanish output uses en dashes
    "PT018",
]
# The live end-to-end test reports per-node timings on purpose.
"tests/e2e/**" = ["T201"]
# Developer CLI tables: the report rows and progress prints are the product.
"src/nexus/rag/evaluate.py" = ["T201", "E501", "ASYNC240"]
# Benchmark CLI progress lines are its output; the Markdown report uses en dashes for empty cells.
"src/nexus/bench/cli.py" = ["T201"]
"src/nexus/bench/report.py" = ["RUF001", "E501"]
# Alembic revision files are generated.
"src/nexus/db/migrations/versions/**" = ["UP007", "E501"]
# numpy RNG is deliberate: deterministic synthetic data, not security.
"src/nexus/demo/**" = ["S311"]
# Data tables: one product/branch per line reads better than wrapped tuples; Spanish text uses × and –.
"src/nexus/demo/catalog.py" = ["E501", "RUF001", "RUF002", "RUF003"]
# Rule tables (regexes) and Spanish prompt/assumption text: wrapping would hurt readability; the en dash
# is the intended range separator in user-facing text.
"src/nexus/agent/temporal.py" = ["E501", "RUF001", "RUF002"]
"src/nexus/agent/prompts.py" = ["E501"]
"src/nexus/security/guard.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["nexus"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Docker (Testcontainers)",
    "slow: full-scale data generation",
    "llm: end-to-end against the running stack and a real model (make e2e-agent)",
]
addopts = "-ra --strict-markers -m 'not llm'"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["nexus"]
branch = true
# SQLAlchemy async runs DB calls through greenlets; the API tests run the app in a thread.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
